<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML 도구 허브</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f6fb;
      color: #111827;
    }
    .wrap {
      max-width: 900px;
      margin: 0 auto;
    }
    .hero {
      background: linear-gradient(135deg, #111827, #2563eb);
      color: white;
      padding: 32px;
      border-radius: 28px;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }
    .card {
      display: block;
      padding: 22px;
      border-radius: 22px;
      background: white;
      text-decoration: none;
      color: #111827;
      box-shadow: 0 12px 30px rgba(15, 23, 42, .08);
      border: 1px solid #e5e7eb;
    }
    .card:hover {
      transform: translateY(-3px);
    }
    .card h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }
    .card p {
      margin: 0;
      color: #64748b;
      line-height: 1.5;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>HTML 도구 허브</h1>
      <p>자주 쓰는 HTML 툴을 한 곳에서 바로 실행하세요.</p>
    </section>

    <section class="grid">
      <a class="card" href="./profit-calculator.html">
        <h2>손익 계산기</h2>
        <p>매출, 원가, 수수료를 입력해 영업이익을 계산합니다.</p>
      </a>

      <a class="card" href="./image-converter.html">
        <h2>이미지 변환기</h2>
        <p>이미지를 용도별 규격으로 변환합니다.</p>
      </a>

      <a class="card" href="./baby-growth.html">
        <h2>성장일기</h2>
        <p>아이 성장 기록을 평균 발달 기준과 비교합니다.</p>
      </a>
    </section>
  </main>
</body>
</html>
